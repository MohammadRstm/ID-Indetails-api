# Weekly update pull requests, grouped per ecosystem. They go through CI and are merged by hand: nothing upgrades
# itself, and the backend rules ask for no dependency upgrade without review.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # EF Core, its MySQL provider (Pomelo) and the naming conventions move a major version together, once Pomelo
    # supports it: a new EF Core major alone doesn't build. Minor and patch updates still come.
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Pomelo.EntityFrameworkCore.MySql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "EFCore.NamingConventions"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
