# Security updates only. Dependabot opens a pull request when a package this repository uses has a known
# vulnerability with a fix (the repository's "Dependabot security updates" setting, which is on). Routine version
# updates are off: open-pull-requests-limit 0 stops them. Every pull request goes through CI and is merged by hand.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # EF Core, its MySQL provider (Pomelo) and the naming conventions move a major version together, by hand, once
    # Pomelo supports it: a new EF Core major alone doesn't build.
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Pomelo.EntityFrameworkCore.MySql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "EFCore.NamingConventions"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
