# Checks every pull request to master, and master after each merge. Nothing is published or deployed here: that
# is the manual Deploy workflow.
name: CI

# Not for changes CI never looks at: documentation, and the load-test scripts, stack and workflows (their own tool is
# built and tested here, so changes to it still run CI). A pull request is judged by all its changes together.
on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "load-tests/k6/**"
      - "load-tests/stack/**"
      - "load-tests/scripts/**"
      - ".github/workflows/load-test*.yml"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "load-tests/k6/**"
      - "load-tests/stack/**"
      - "load-tests/scripts/**"
      - ".github/workflows/load-test*.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # A throwaway database server that lives as long as the job; not a secret.
  MYSQL_ROOT_PASSWORD: ci-only-root-password

jobs:
  # Two machines share the tests, each with its own database: the unit tests and half the integration tests on the
  # first, the other half on the second. The images are built and checked alongside them, not after.
  test:
    name: Build and tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # The same server settings as development (docker-compose.yml): utf8mb4 and UTC.
      - name: Start MySQL
        run: |
          docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" mysql:8.4 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --default-time-zone=+00:00
          for i in $(seq 1 60); do docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent && break; sleep 2; done

      # The SMTP sender's test delivers a real email to Mailpit and reads it back, as in development.
      - name: Start Mailpit
        run: |
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:v1.31.2
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8025/api/v1/info >/dev/null && break; sleep 1; done

      - name: Restore
        run: dotnet restore ID-Indetails.slnx

      # Warnings fail the build, as nullable warnings are meant to be fixed, not left.
      - name: Build
        run: dotnet build ID-Indetails.slnx -c Release --no-restore -warnaserror

      # Proton reads a video through pictures ffmpeg takes, as the API's image does: a unit test checks it (skipped
      # without ffmpeg). A static build from GitHub, checked against its published checksum and kept in the cache for
      # the month, instead of Ubuntu's package mirror on every run (anywhere from 20 seconds to 5 minutes). Optional:
      # if it can't be had, only that test is skipped.
      - name: Month, for the ffmpeg cache
        id: month
        if: matrix.shard == 1
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache ffmpeg
        if: matrix.shard == 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-${{ steps.month.outputs.month }}

      - name: Install ffmpeg
        if: matrix.shard == 1
        timeout-minutes: 3
        continue-on-error: true
        run: |
          # downloaded aside, and moved into the cached folder only once its checksum matches
          if [ ! -x "$HOME/ffmpeg/ffmpeg" ]; then
            name=ffmpeg-master-latest-linux64-gpl.tar.xz
            base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
            work=$(mktemp -d)
            curl -fsSL --retry 3 -o "$work/ffmpeg.tar.xz" "$base/$name"
            curl -fsSL --retry 3 -o "$work/checksums.sha256" "$base/checksums.sha256"
            expected=$(awk -v f="$name" '$2 == f || $2 == "*" f { print $1 }' "$work/checksums.sha256")
            actual=$(sha256sum "$work/ffmpeg.tar.xz" | cut -d ' ' -f 1)
            if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
              echo "::warning::ffmpeg's checksum didn't match, so its test is skipped"
              exit 1
            fi
            tar -xJf "$work/ffmpeg.tar.xz" -C "$work" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            mkdir -p "$HOME/ffmpeg"
            mv "$work/ffmpeg" "$work/ffprobe" "$HOME/ffmpeg/"
          fi
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"

      - name: Unit tests
        if: matrix.shard == 1
        run: dotnet test ID-Indetails.UnitTests -c Release --no-build

      - name: Load-test tool tests
        if: matrix.shard == 1
        run: dotnet test load-tests/tool-tests -c Release --no-build

      # Every other test class (by file) on the first machine; the second runs everything the first doesn't, so a
      # class can never be left out, whatever its file is called.
      - name: Integration tests
        env:
          ID_INDETAILS_TEST_MYSQL_ADMIN: Server=127.0.0.1;Port=3306;User=root;Password=${{ env.MYSQL_ROOT_PASSWORD }};
          SHARD: ${{ matrix.shard }}
        run: |
          first=()
          i=0
          while IFS= read -r file; do
            if [ $((i % 2)) -eq 0 ]; then
              ns=$(sed -n 's/^namespace \([A-Za-z0-9_.]*\).*/\1/p' "$file" | head -n 1)
              first+=("$ns.$(basename "$file" .cs).")
            fi
            i=$((i + 1))
          done < <(find ID-Indetails.IntegrationTests -name '*Tests.cs' -not -path '*/bin/*' -not -path '*/obj/*' | LC_ALL=C sort)
          if [ "$SHARD" = 1 ]; then
            filter=$(printf 'FullyQualifiedName~%s|' "${first[@]}")
            filter=${filter%|}
          else
            filter=$(printf 'FullyQualifiedName!~%s&' "${first[@]}")
            filter=${filter%&}
          fi
          echo "Shard $SHARD of 2: ${#first[@]} of $i test files run on the first"
          dotnet test ID-Indetails.IntegrationTests -c Release --no-build --filter "$filter"

      - name: Check for vulnerable packages
        if: matrix.shard == 1
        run: |
          dotnet list ID-Indetails.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::A package has a known vulnerability (above)."
            exit 1
          fi

  # Alongside the tests. The images' Ubuntu security fixes are fetched afresh once a day (SECURITY_REFRESH) rather
  # than on every run; a deployment still fetches them every time (deploy.yml). Only master writes the layer cache,
  # which every pull request reads.
  image:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Day, for the security fixes
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build the API image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          build-args: SECURITY_REFRESH=${{ steps.day.outputs.day }}
          load: true
          push: false
          tags: id-indetails-api:ci
          cache-from: type=gha,scope=api
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=api' || '' }}

      - name: Build the migrations image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrations
          build-args: SECURITY_REFRESH=${{ steps.day.outputs.day }}
          load: true
          push: false
          tags: id-indetails-migrations:ci
          cache-from: type=gha,scope=api
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=api' || '' }}

      # As a deployment does it: migrate an empty database, then start the API in Production and wait for it.
      - name: Smoke-test the images
        run: |
          fail() { echo "::error::$1"; docker logs api 2>&1 | tail -50 || true; exit 1; }
          docker run -d --name mysql --network host -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" -e MYSQL_DATABASE=id_indetails mysql:8.4 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --default-time-zone=+00:00
          for i in $(seq 1 60); do docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent && break; sleep 2; done
          db="Server=127.0.0.1;Port=3306;Database=id_indetails;User=root;Password=$MYSQL_ROOT_PASSWORD;"

          docker run --rm --network host -e ConnectionStrings__Default="$db" id-indetails-migrations:ci || fail "the migrations didn't apply"

          docker run -d --name api --network host --read-only --tmpfs /tmp \
            --mount type=volume,source=files,target=/app/App_Data/files \
            --cap-drop ALL --security-opt no-new-privileges \
            -e ConnectionStrings__Default="$db" \
            -e Jwt__SigningKey="$(openssl rand -base64 48)" \
            -e Setup__SuperAdminKey="$(openssl rand -base64 32)" \
            -e Frontend__BaseUrl=https://app.example.com \
            -e Email__Host=smtp.example.com -e Email__UseStartTls=true -e Email__FromAddress=no-reply@example.com \
            -e Proxy__KnownNetworks__0=172.16.0.0/12 \
            id-indetails-api:ci
          # /health answers 503 when unhealthy, which curl -f treats as a failure
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:8080/health && break; sleep 2; done
          curl -fs -o /dev/null http://127.0.0.1:8080/health || fail "the API isn't healthy"
          [ "$(docker exec api id -u)" != "0" ] || fail "the API runs as root"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/auth/me)" = "401" ] || fail "an API route doesn't answer 401 when signed out"
          # the public health check, for an uptime monitor, says only whether it's up
          [ "$(curl -s http://127.0.0.1:8080/api/health)" = "Healthy" ] || fail "the public health check doesn't answer Healthy"
          # development settings must stop it
          docker rm -f api >/dev/null
          status=0
          timeout 60 docker run --rm --network host -e ConnectionStrings__Default="$db" -e Jwt__SigningKey="$(openssl rand -base64 48)" \
            id-indetails-api:ci >/dev/null 2>&1 || status=$?
          [ "$status" -ne 0 ] && [ "$status" -ne 124 ] || fail "it started in Production on development settings"

      - name: Scan the API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: id-indetails-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the migrations image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: id-indetails-migrations:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
