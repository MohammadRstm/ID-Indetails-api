# Production only: the stack the Deploy workflow runs on the server. Development doesn't use it.
#
# The images come from GHCR, tagged by the workflow (API_TAG, CLIENT_TAG). Everything else comes from .env next to
# this file on the server, which only the deploy user can read (see .env.production.example). Only Caddy is
# reachable from outside (80 and 443): it handles HTTPS and forwards to the client's nginx.
name: id-indetails

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    volumes:
      - db_data:/var/lib/mysql
    networks: [data]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Applies the migrations of the API version being deployed, then exits. Run by the deploy before the API starts.
  migrations:
    image: ghcr.io/mohammadrstm/id-indetails-migrations:${API_TAG:?}
    profiles: [migrate]
    command: ["--connection", "Server=db;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};"]
    networks: [data]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ghcr.io/mohammadrstm/id-indetails-api:${API_TAG:?}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ConnectionStrings__Default: Server=db;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?}
      # Only while creating the first super admin; empty, the setup endpoint doesn't exist (docs/server-setup.md).
      Setup__SuperAdminKey: ${SETUP_SUPER_ADMIN_KEY:-}
      Frontend__BaseUrl: https://${PUBLIC_DOMAIN:?}
      Email__Host: ${SMTP_HOST:?}
      Email__Port: ${SMTP_PORT:-587}
      Email__UseStartTls: ${SMTP_STARTTLS:-true}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM:?}
      # The client's nginx, and the TLS proxy before it, are trusted for the visitor's address and scheme.
      Proxy__KnownNetworks__0: 172.30.0.0/24
    volumes:
      - files:/app/App_Data/files
    networks: [data, proxy]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/mohammadrstm/id-indetails-client:${CLIENT_TAG:?}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      API_UPSTREAM: http://api:8080
    networks: [proxy]
    depends_on:
      api:
        condition: service_healthy

  # HTTPS: the certificate for PUBLIC_DOMAIN, renewed by itself, kept on the caddy_data volume.
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [proxy]
    depends_on:
      - web

networks:
  # MySQL and the API: no route outside.
  data:
    internal: true
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db_data:
  files:
  caddy_data:
  caddy_config:
