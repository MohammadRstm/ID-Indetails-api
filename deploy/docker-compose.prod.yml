# Production only: the stack the Deploy workflow runs on the server. Development doesn't use it.
#
# The images come from GHCR, tagged by the workflow (API_TAG, CLIENT_TAG). Everything else comes from .env next to
# this file on the server, which only the deploy user can read (see .env.production.example). Only Caddy is
# reachable from outside (80 and 443): it handles HTTPS and forwards to the client's nginx.
name: id-indetails

# Every container's log is rotated: 5 files of 10 MB, compressed, so logs can't fill the disk the database shares.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      # The API's own user, with data rights only; created on each deployment (api-db-user.sh).
      MYSQL_API_USER: ${MYSQL_API_USER:?}
      MYSQL_API_PASSWORD: ${MYSQL_API_PASSWORD:?}
    volumes:
      - db_data:/var/lib/mysql
    networks: [data]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Applies the migrations of the API version being deployed, then exits. Run by the deploy before the API starts.
  migrations:
    image: ghcr.io/mohammadrstm/id-indetails-migrations:${API_TAG:?}
    profiles: [migrate]
    logging: *logging
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The bundle builds the API's services, which read the connection string from the environment. It alone connects
    # as the schema owner.
    environment:
      ConnectionStrings__Default: Server=db;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};
    networks: [data]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ghcr.io/mohammadrstm/id-indetails-api:${API_TAG:?}
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      # Data rights only: the running API can't alter or drop tables.
      ConnectionStrings__Default: Server=db;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_API_USER};Password=${MYSQL_API_PASSWORD};
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?}
      # Only while creating the first super admin; empty, the setup endpoint doesn't exist (docs/server-setup.md).
      Setup__SuperAdminKey: ${SETUP_SUPER_ADMIN_KEY:-}
      Frontend__BaseUrl: https://${PUBLIC_DOMAIN:?}
      Email__Host: ${SMTP_HOST:?}
      Email__Port: ${SMTP_PORT:-587}
      Email__UseStartTls: ${SMTP_STARTTLS:-true}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM:?}
      BugReports__ToAddress: ${BUG_REPORTS_TO:-mohammadrstm2004@gmail.com}
      # Proton, the read-only assistant: off unless switched on with an Anthropic API key (docs/proton.md).
      Proton__Enabled: ${PROTON_ENABLED:-false}
      Proton__ApiKey: ${PROTON_API_KEY:-}
      Proton__MonthlyBudgetUsd: ${PROTON_MONTHLY_BUDGET_USD:-50}
      Proton__Voice__Enabled: ${PROTON_VOICE_ENABLED:-false}
      Proton__Voice__ApiKey: ${PROTON_VOICE_API_KEY:-}
      # Pushes to the phone app: off unless switched on; Expo's access token is optional (docs/notifications.md).
      Push__Enabled: ${PUSH_ENABLED:-false}
      Push__Expo__AccessToken: ${EXPO_ACCESS_TOKEN:-}
      # The client's nginx, and the TLS proxy before it, are trusted for the visitor's address and scheme.
      Proxy__KnownNetworks__0: 172.30.0.0/24
    volumes:
      - files:/app/App_Data/files
    networks: [data, proxy]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/mohammadrstm/id-indetails-client:${CLIENT_TAG:?}
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      API_UPSTREAM: http://api:8080
    networks: [proxy]
    depends_on:
      # nginx looks the API up once, when it starts: it restarts with the API, so it never keeps a stale address
      api:
        condition: service_healthy
        restart: true

  # HTTPS: the certificate for PUBLIC_DOMAIN, renewed by itself, kept on the caddy_data volume.
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [proxy]
    depends_on:
      - web

networks:
  # MySQL and the API: no route outside.
  data:
    internal: true
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db_data:
  files:
  caddy_data:
  caddy_config:
